[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twohg-guide"
version = "0.1.0"
description = "Two-Headed Giant prerelease cheat sheets for an MTG set (shared from mtg-utils)"
requires-python = ">=3.12"
dependencies = ["click>=8.0", "requests>=2.28", "beautifulsoup4>=4.12"]

[project.scripts]
# twohg-guide's own CLIs (the modules live in mtg_utils like every skill's)
twohg-scan = "mtg_utils.twohg_scan:main"
limited-stats = "mtg_utils.limited_stats:main"
thread-extract = "mtg_utils.thread_extract:main"
guide-card-hovers = "mtg_utils.guide_card_hovers:main"
twohg-template = "mtg_utils.guide_card_hovers:template_main"

# Reused from mtg-utils
download-mtgjson = "mtg_utils.download_mtgjson:main"
scryfall-lookup = "mtg_utils.scryfall_lookup:main"
set-scan = "mtg_utils.set_scan:set_scan_main"

# Rules verification (the Phase 3 rules audit; also re-declared by rules-lawyer)
download-rules = "mtg_utils.download_rules:main"
rules-lookup = "mtg_utils.rules_lookup:main"
rulings-lookup = "mtg_utils.rulings_lookup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests/twohg-guide"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    # Pinned exactly, and identically across all nine pyproject.toml files: CI
    # lints/formats the WHOLE repo with mtg-utils' ruff, so a skill resolving a
    # different version formats code CI then rejects. `>=` previously let the eight
    # lockfiles drift across six versions. It also matters that `select = ["ALL"]`
    # below opts into EVERY rule, so each ruff release auto-enables new ones — the
    # 0.15 -> 0.16 bump added five (CPY001/RUF036/ISC004/PLR0917/FURB192). An
    # unpinned resolver bump therefore fails CI with no code change to blame. Bump
    # deliberately, in all nine at once, and triage the new rules — ignore-list or
    # fix — in that same commit.
    "ruff==0.16.2",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle — skip docstring enforcement
    "ANN",     # flake8-annotations — skip type annotation enforcement
    "ERA",     # eradicate — skip commented-out code detection
    "FIX",     # fixme — allow TODO/FIXME comments
    "TD",      # flake8-todos — skip TODO format enforcement
    "S",       # bandit — skip security checks (CLI tool, not a service)
    "INP001",  # implicit-namespace-package
    "T20",     # flake8-print — CLI tool uses print/click.echo
    "TRY003",  # long exception messages are fine
    "EM",      # exception message formatting — overly strict
    "PLR2004", # magic values
    "COM812",  # trailing comma — conflicts with formatter
    "ISC001",  # implicit string concat — conflicts with formatter
    "C901",    # complexity — Click commands are inherently branchy
    "PLR0912", # too many branches
    "PLR0913", # too many arguments — Click commands need many params
    "PLR0911", # too many return statements — parser helpers are naturally multi-exit
    "TC",      # type-checking imports
    "PLC0415", # non-top-level import
    "ARG002",  # unused method argument — mock patches require positional args
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "SLF001",
    "E501",
    "PERF401",
]
"../tests/*" = [
    "SLF001",
    "E501",
    "PERF401",
    "N999",
]
